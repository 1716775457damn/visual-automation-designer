name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: '--target x86_64-pc-windows-msvc'

          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            tauri_args: '--target x86_64-apple-darwin'

          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: '--target aarch64-apple-darwin'

          - platform: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: '--target x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libx11-dev \
            libssl-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Visual Automation Designer {0}', github.ref_name) || '' }}
          releaseBody: |
            ## ${{ github.ref_name }}

            ### 架构拆分
            - **前端**: App.tsx (37KB → AppShell+AppProviders), useFlow.ts (24KB → 4 hooks), FlowCanvas.tsx (22KB → 3 files), BlockConfig.tsx (20KB → 3 components)
            - **后端**: executor.rs (41KB → 4 modules), validator.rs (28KB → 3 modules)

            ### P0 性能修复
            - 修复 onDragOver 重渲染循环，handleNodesChange 连锁重建
            - onPaneMouseMove 添加 rAF 节流，addConnection 改用 useReducer

            ### 设计 Token 体系
            - --vad- 前缀 CSS 变量：colors/spacing/typography/shadows/radii/transitions
            - 暗色/亮色双主题

            ### 无障碍 (WCAG AA)
            - 全部核心组件 ARIA 标签 + 键盘导航 + 焦点管理

            ### UI 微交互
            - 节点 hover 发光、拖拽连线动画、Toast 出入场 + reduced-motion 保护

            ### 多平台
            - Windows: nsis + msi
            - macOS: Intel + Apple Silicon 独立 dmg
            - Linux: AppImage + deb
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-automation-designer-${{ matrix.platform }}-${{ matrix.rust_target }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
